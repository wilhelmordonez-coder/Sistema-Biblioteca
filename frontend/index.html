<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel administrativo | Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header></header>
  <main>
    <section class="intro">
      <h1>Panel administrativo de la <mark>biblioteca</mark></h1>
      <p>Resumen para el personal: material por sección y préstamos que aún no han sido devueltos.</p>
    </section>
    <section class="stats" id="stats" aria-label="Resumen por sección"></section>
    <section class="panel">
      <h2>Préstamos pendientes de devolución</h2>
      <div class="tabla">
        <table id="tabla-activos">
          <thead><tr><th>Material</th><th>Usuario</th><th>Prestado</th><th>Devolver el</th><th>Estado</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer></footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
